
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-parser
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-parser
  template:
    metadata:
      labels:
        app: cloud-parser
    spec:
      containers:
        - name: parser
          image: cloud-parser:v3
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-parser
  namespace: app
spec:
  type: ClusterIP
  selector:
    app: cloud-parser
  ports:
    - port: 8000
      targetPort: 8000
