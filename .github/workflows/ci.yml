name: Project CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: |
          python -m compileall -q service training worker tools tests

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify student JSON validity
        run: |
          python -c "import json; d=json.load(open('results/evaluation_v2.json')); print(json.dumps(d,indent=2))"
